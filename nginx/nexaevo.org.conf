# nexaevo.org — static landing page (temporary host: shared server 194.233.82.190).
# HTTP only until certbot issues the certificate; certbot --nginx adds the 443 block.
server {
    server_name nexaevo.org www.nexaevo.org;

    root /var/www/nexaevo.org;
    index index.html;

    access_log /var/log/nginx/nexaevo.org.access.log;
    error_log  /var/log/nginx/nexaevo.org.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location ~* \.(png|svg|ico)$ { expires 7d; access_log off; }
    location / { try_files $uri $uri/ =404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nexaevo.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nexaevo.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.nexaevo.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nexaevo.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nexaevo.org www.nexaevo.org;
    return 404; # managed by Certbot




}